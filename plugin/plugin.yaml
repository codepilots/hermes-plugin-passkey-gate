name: passkey-gate

version: 0.4.0

description: >
  Passkey (WebAuthn) authorization gate for high-authority agent actions.
  The agent mints a challenge bound bit-for-bit to the exact action text and
  tool call; only a human passkey can approve it; the agent then verifies the
  signed assertion locally against a pinned public key before acting.
  No agent ever holds a private key, approvals are single-use, and an
  append-only hash-chained audit log detects edits and corruption within
  the log; its head can be notarized to an operator-kept file outside the
  gate data dir, which is what detects a wholesale rewrite.

author: Autumn Thomson (codepilots)

provides_tools:
  - gate_challenge
  - gate_verify
  - gate_status

provides_hooks:
  - pre_tool_call

config_schema:
  origin:
    type: str
    default: ""
    label: "Gate origin"
    description: "HTTPS origin of the gate service, e.g. https://your-host.ts.net:8445. Leave empty to run the verifier in offline-check-only mode against an already-fetched record."
  rp_id:
    type: str
    default: ""
    label: "RP ID"
    description: "WebAuthn RP ID — usually the domain name the gate origin is served on (e.g. yourhost.ts.net)."
  port:
    type: int
    default: 8655
    label: "Serve port"
    description: "Port for 'hermes passkey-gate serve' (binds 127.0.0.1; put it behind TLS with tailscale serve, an nginx proxy, or similar)."
  challenge_ttl:
    type: int
    default: 600
    label: "Challenge TTL"
    description: "Seconds a challenge stays pending after creation."
  require_passkey:
    type: bool
    default: false
    label: "Enforce passkey before listed tool calls"
    description: "When true, pre_tool_call blocks tool calls matching authority_patterns unless a challenge bound to that exact tool call was approved (and binds user verification). Opt-in."
  authority_patterns:
    type: list
    default: []
    label: "Authority patterns"
    description: "Regex list matched against 'tool_name + canonical JSON of tool args' (e.g. '^terminal .*(rm |curl |scp |dd )') that trigger passkey enforcement when require_passkey is true."
  parent_gate_allowlist:
    type: list
    default: []
    label: "Parent gate allowlist"
    description: "Origins (scheme+host+port, exact match, no wildcards) of peer gates this gate may fetch to re-check a claimed parent approval. Empty (the default) disables ALL parent-gate fetches — a claimed prior approval then renders as 'unverified (parent gate not on allowlist)' and is never fetched."
  audit_notary_path:
    type: str
    default: ""
    label: "Audit notary file"
    description: "Operator-controlled file (OUTSIDE the gate data dir) where 'hermes passkey-gate audit-notarize' appends the current audit-chain head hash, and which 'audit-verify' compares against the chain to detect a wholesale rewrite. The chain alone only detects partial edits — this external anchor is the tamper evidence. Non-security setting: it names where anchors are kept, not what the gate enforces."

python_dependencies:
  - webauthn==1.11.*
  - qrcode==7.*
