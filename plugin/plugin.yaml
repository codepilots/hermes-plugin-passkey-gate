name: passkey-gate

version: 0.8.0

description: >
  Approve your agents' risky actions with your phone's passkey. An agent
  asks for approval of an exact action (and, optionally, the exact command
  to run); you read it on your phone and sign with Face ID, a fingerprint or
  your screen lock; the agent checks your signature against your key before
  acting. Optional enforcement blocks matching commands until you approve
  them, each approval running once. Requests, approvals and setting
  changes go into a tamper-evident audit log. Start with `hermes passkey-gate setup`.

requires_hermes: ">=0.21.5"

author: Autumn Thomson (codepilots)

provides_tools:
  - gate_challenge
  - gate_verify
  - gate_status

provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_gateway_admission

config_schema:
  origin:
    type: str
    default: ""
    label: "Gate address (origin)"
    description: "The HTTPS address your phone uses to reach the gate, e.g. https://your-host.your-tailnet.ts.net. `hermes passkey-gate setup` fills this in. Until it's set, approval requests have no link. Setting it the first time is free; changing it later needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  rp_id:
    type: str
    default: ""
    label: "Passkey domain (RP ID)"
    description: "The web domain your passkey is registered to (WebAuthn \"RP ID\"). Leave empty to use the gate address's host name. Set it to a broader domain, such as your-tailnet.ts.net, to reuse a passkey you already have there. Changing it later needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  port:
    type: int
    default: 8655
    label: "Local port"
    description: "Local port the gate listens on, 1–65535. It only listens on 127.0.0.1; Tailscale or your own HTTPS proxy forwards to it."
  challenge_ttl:
    type: int
    default: 600
    label: "Request lifetime (seconds)"
    description: "Seconds from creation until a request, and any approval of it, expires: 1–86400 (default 10 minutes). Shortening it is free; lengthening it needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  require_passkey:
    type: bool
    default: false
    label: "Require passkey for matching tool calls"
    description: "When on, any tool call matching an authority pattern is blocked until you approve that exact call with your passkey. Each approval lets the call run once. Turning this off needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  authority_patterns:
    type: list
    default: []
    label: "Commands that need approval (patterns)"
    description: "Which tool calls need your approval when enforcement is on: regular expressions matched against the tool name followed by its arguments as JSON, e.g. '^terminal .*(rm -rf|curl |scp |dd )'. Up to 100 patterns of up to 200 characters each; a list with any invalid pattern is rejected whole. Removing a pattern needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  parent_gate_allowlist:
    type: list
    default: []
    label: "Trusted peer gates"
    description: "Other people's gates this gate may contact, to check an approval their human already gave (exact origins, e.g. https://their-host.ts.net:8445, no wildcards). Empty, the default, means it never contacts another gate, and such approvals are shown as unverified claims. Adding an entry needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  audit_notary_path:
    type: str
    default: ""
    label: "Audit anchor file"
    description: "A file outside the gate's data folder, where `audit-notarize` records the audit log's latest fingerprint and `audit-verify` checks against it. This is what detects the whole log being rewritten. Keep it somewhere agents can't write."
  gated_lanes:
    type: list
    default: [local, owner, others, bots, agents]
    label: "Which conversations need a passkey (lanes)"
    description: "Which conversations enforcement applies to. local: you at this computer (CLI, TUI, Desktop). owner: chats from the senders in owner_senders. others: chats from anyone else, scheduled jobs, webhooks and anything whose origin can't be told. bots: chat messages from senders the platform marks as bots. agents: another agent talking to this one (A2A, Hermes peer DMs). The default gates all five. Once an agent or other sender speaks in a session, that session stays in their lane. Removing a lane needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."
  owner_senders:
    type: list
    default: []
    label: "Your chat accounts (owner senders)"
    description: "Your own chat accounts, as platform:user_id (e.g. telegram:123456789), so your chats fall in the owner lane instead of others. Only as trustworthy as the chat account itself. Adding an entry needs your passkey when done with `hermes passkey-gate set` (edits here aren't checked)."

python_dependencies:
  - webauthn>=2,<4
  - qrcode>=7,<9
