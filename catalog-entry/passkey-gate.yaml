name: passkey-gate
repo: https://github.com/codepilots/hermes-plugin-passkey-gate
sha: e82f2240b6c1d8424133bb9b981ddfd3fa8c47b5   # full 40-char pin; validate ran against THIS commit (v0.7.1)
subdir: plugin
description: "Approve your agents' risky actions with your phone's passkey, even when you're not at the agent's keyboard. An agent asks for approval of an exact action (and optionally the exact command); you get a link in any chat, read it on your phone and sign with Face ID, a fingerprint or your screen lock; the agent then verifies your signature locally against your pinned key before acting. A relayed 'the human said yes' proves nothing; only your signature counts. Optional enforcement blocks matching tool calls until you approve them, and each approval runs once. Includes a guided `setup` wizard, a background service, a hash-chained audit log, and approvals between agents owned by different people. It is an honest approval record, and becomes a hard boundary only when agents can't modify the gate (see the README's Security model)."
maintainer: codepilots
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/codepilots/hermes-plugin-passkey-gate
version: "0.7.1"
platforms: [linux, macos]
