sha: bec3b78dc3ecc0b10418ac1291cfa0052fc4d81e   # full 40-char pin; validate ran against THIS commit   # full 40-char pin; validate ran against THIS commit   # full 40-char pin; validate ran against THIS commit
subdir: plugin
description: "Passkey (WebAuthn) authorization gate for high-authority agent actions. The problem: an agent teammate behind a firewall (another machine/network/schedule) needs real authorization but the human is NOT at its keyboard — Hermes's session-scoped approvals surface prompts where the human is, and an isolated or peer agent gets silence. This plugin lets any agent mint a WebAuthn challenge bound bit-for-bit to exact action text (and optionally a canonical tool-call binding) and deliver the approval URL through any channel the human reads; only a human passkey can approve (UV enforced, agents hold no private key). gate_verify re-derives the proof locally (sha256 binding, signature over authenticatorData||sha256(clientDataJSON), UP/UV flags, origin/RP match, max age, pinned owner key). Approvals are single-use; enforced mode (require_passkey + authority_patterns) makes pre_tool_call block matching calls until an approved-but-unconsumed challenge covers that exact binding, then consumes it. Cross-human collaboration: challenges carry the asking agent and its OWNER plus a signer-facing why; when another human already approved on their own gate the page re-checks that record locally and shows the verdict (per-owner key pinning). Append-only hash-chained audit log detects edits/deletions. CLI: serve, bootstrap, expose (auto-detects tailscale serve with TLS-verified ports / cloudflared quick tunnels and persists origin), pin, show (QR), set, get, status, audit-verify."
maintainer: codepilots
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/codepilots/hermes-plugin-passkey-gate
version: "0.2.0"
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - gate_challenge
    - gate_verify
    - gate_status
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
