sha: 9c227722992661dbd966d426a8144e73868d0b81   # full 40-char pin; validate ran against THIS commit
subdir: plugin
description: "Passkey (WebAuthn) authorization gate for high-authority agent actions: cryptographically verified human approval — a tamper-evident record of what the human actually signed, not prompt-gated 'I promise'. The problem: an agent teammate behind a firewall (another machine/network/schedule) needs real authorization but the human is NOT at its keyboard — Hermes's session-scoped approvals surface prompts where the human is, and an isolated or peer agent gets silence. This plugin mints a WebAuthn challenge bound bit-for-bit to the exact action text (and optionally a canonical tool-call binding) and delivers the approval URL through any channel the human actually reads; approval is a WebAuthn signature from the owner passkey registered through the operator's out-of-band ceremony — no agent ever holds a private key. gate_verify re-derives the proof locally (sha256 binding, signature over authenticatorData||sha256(clientDataJSON), user-presence + user-verification flags, origin/RP match, max age, pinned owner key). Approvals are single-use when applied: enforced tool-call approvals and gate-weakening set --approve approvals are consumed atomically at apply time, while plain text-only approvals verify until expiry and are not consumed. Opt-in enforcement (require_passkey + authority_patterns) makes pre_tool_call block matching calls until an approved challenge covers that exact binding and re-verifies against the pinned owner key, then consumes it; for bound challenges the signed nonce itself commits to the tool-call binding; downstream execution is NOT enforced by the plugin — whatever finally executes must itself enforce the dispatch_binding. /verify records are minimized to the fields needed for verification; approval URLs stay bearer-readable, so reading cannot approve but anyone holding the URL inputs can read the action text. The append-only hash-chained audit log detects partial edits; detecting a wholesale rewrite additionally requires the operator-anchored notary file outside the gate data dir (audit-notarize / audit-verify --notary). Cross-human collaboration: challenges carry the asking agent and its OWNER plus a signer-facing why; a claimed prior approval on another gate is re-checked locally against that peer's pinned key and renders as a claim until it verifies. Real boundaries are a deployment requirement, not something this plugin enforces alone — see the README's 'Deployment requirements for real boundaries'. CLI: serve, bootstrap, expose (sets up tailscale serve on your tailnet, or validates your own HTTPS origin, and persists it), pin, show (QR), set, get, status, audit-verify, audit-notarize."
maintainer: codepilots
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/codepilots/hermes-plugin-passkey-gate
version: "0.6.0"
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - gate_challenge
    - gate_verify
    - gate_status
  provides_hooks:
